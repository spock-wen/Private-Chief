version: '3.8'

services:
  spockchef-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: spockchef-backend
    ports:
      - "8070:8070"
    depends_on:
      - spockchef-db
    env_file:
      - .env.production
    networks:
      - spockchef-network
    restart: unless-stopped

  spockchef-db:
    image: postgres:15-alpine
    container_name: spockchef-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=wenspock
      - POSTGRES_DB=spockchef
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spockchef-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  spockchef-network:
    name: spockchef-network
    driver: bridge
    external: false
